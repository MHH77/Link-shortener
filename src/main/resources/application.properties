spring.datasource.url=jdbc:h2:file:./data/link-shortener
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.main.banner-mode=off
logging.level.root=warn
logging.level.org.mhh=info
app.moderation-token=${MODERATOR_TOKEN:}
app.writes-per-minute=${WRITES_PER_MINUTE:30}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
server.port=7070
# Custom application properties
url-shortener.min-short-url-length=6
# 1,000,000,000 will result in short URLs of at least 6 characters.
url-shortener.id-offset=1000000000
# Base URL for constructing the full short URL
app.base-url=http://localhost:7070
spring.data.rest.detection-strategy=annotated
